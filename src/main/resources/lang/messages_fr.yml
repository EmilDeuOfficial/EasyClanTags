prefix: "<dark_gray>[<gold>EasyClanTags</gold>]</dark_gray> <gray>"

err:
  no-permission: "<red>Tu n'as pas la permission pour cela."
  player-only: "<red>Cette commande est réservée aux joueurs."
  disabled: "<red>EasyClanTags est désactivé."
  usage: "<red>Utilisation : <white><usage>"
  player-not-found: "<red>Le joueur <white><player></white> est introuvable."
  clan:
    unknown: "<red>Aucun clan ne correspond à <white><clan></white>."
    already: "<red>Tu es déjà dans un clan."
    none: "<red>Tu n'es dans aucun clan."
    none-other: "<red>Ce joueur n'est dans aucun clan."
    not-owner: "<red>Seul le propriétaire du clan peut faire cela."
    name-invalid: "<red>Les noms de clan font de <white><min></white> à <white><max></white> caractères autorisés."
    name-taken: "<red>Le nom de clan <white><clan></white> est déjà pris."
    full: "<red>Le clan est complet (<white><max></white> membres)."
    owner-cannot-leave: "<red>Le propriétaire ne peut pas partir. Transfère le clan ou dissous-le."
  target:
    self: "<red>Tu ne peux pas faire cela sur toi-même."
    in-clan: "<white><player></white> <red>est déjà dans un clan."
    not-member: "<white><player></white> <red>n'est pas dans ton clan."
  invite:
    none: "<red>Tu n'as aucune invitation correspondante."
    choose: "<red>Tu as plusieurs invitations. Indique le nom du clan."
  tag:
    empty: "<red>Le tag ne peut pas être vide."
    length: "<red>Le tag doit contenir de <white><min></white> à <white><max></white> caractères."
    chars: "<red>Le tag contient des caractères non autorisés."
    blacklisted: "<red>Le tag contient le mot interdit <white><word></white>."
    taken: "<red>Le tag <white><tag></white> est déjà utilisé par le clan <white><clan></white>."
    none: "<red>Ce clan n'a pas de tag."
    unknown: "<red>Aucun clan n'utilise le tag <white><tag></white>."
  format:
    disabled: "<red>Le format <white><format></white> est désactivé sur ce serveur."
    no-permission: "<red>Tu ne peux pas utiliser le format <white><format></white>."
  color:
    hex-denied: "<red>Tu ne peux utiliser que les 16 couleurs par défaut."
    invalid-hex: "<red>Ce code hex est invalide. Utilise par exemple <white>#FF8800</white>."
  gradient:
    disabled: "<red>Les dégradés sont désactivés sur ce serveur."
    no-permission: "<red>Tu ne peux pas utiliser les dégradés."
    needs-hex: "<red>Les dégradés demandent la permission pour les couleurs hex."
  cooldown: "<red>Ton clan pourra modifier son tag dans <white><time></white>."

ok:
  clan:
    created: "<green>Clan <white><clan></white> créé. Ouvre <white>/clantag</white> pour créer le tag."
    disbanded: "<green>Clan <white><clan></white> dissous."
    left: "<green>Tu as quitté le clan <white><clan></white>."
  invite:
    sent: "<green><white><player></white> a été invité dans <white><clan></white>."
    accepted: "<green>Tu as rejoint <white><clan></white>."
    denied: "<green>Invitation de <white><clan></white> refusée."
  member:
    kicked: "<green><white><player></white> a été exclu du clan."
  owner:
    transferred: "<green><white><player></white> est maintenant propriétaire du clan."
  tag:
    set: "<green>Le tag du clan est maintenant <white><tag></white>."
  admin:
    removed: "<green>Le tag du clan <white><clan></white> a été retiré."
    deleted: "<green>Le clan <white><clan></white> avec le tag <white><tag></white> a été supprimé."

note:
  invited: "<white><player></white> t'a invité dans le clan <white><clan></white>. Utilise <white>/clantag accept <clan></white> dans les <white><seconds></white> s ou ouvre <white>/clantag</white>."
  joined: "<white><player></white> a rejoint le clan."
  left: "<white><player></white> a quitté le clan."
  kicked: "<red>Tu as été exclu du clan <white><clan></white>."
  transferred: "<white><player></white> est le nouveau propriétaire du clan."
  disbanded: "<red>Le clan <white><clan></white> a été dissous."

input:
  clan-name: "<yellow>Écris le nom de ton clan dans le chat."
  tag-text: "<yellow>Écris le texte du tag dans le chat."
  hex: "<yellow>Écris une couleur hex comme <white>#FF8800</white> dans le chat."
  hint: "<gray>Écris <white>cancel</white> pour annuler."
  timeout: "<red>Le délai de saisie est dépassé."
  cancelled: "<gray>Saisie annulée."

preview:
  header: "<gold>Aperçu du tag"
  nametag: "<gray>Nom au-dessus de la tête : <nametag>"
  tab: "<gray>Liste des joueurs : <tab>"
  chat: "<gray>Chat : <chat>"

cmd:
  reloaded: "<green>Configuration et fichiers de langue rechargés."
