  delete-confirm: "<yellow>Cela dissout ton clan. Utilise <white>/<label> delete confirm</white> pour continuer."
  status:
    - "<gold>État d'EasyClanTags"
    - "<gray>État : <state>"
    - "<gray>Clans : <white><clans></white>, joueurs avec un tag : <white><tagged></white>"
    - "<gray>Stockage : <white><storage></white>, langue : <white><language></white>"
  help:
    header: "<gold>Commandes d'EasyClanTags"
    line: "<gray>/<label> <white><sub></white> <gray><usage> - <description>"
  description:
    "on": "Activer le plugin"
    "off": "Désactiver le plugin"
    status: "Afficher l'état"
    reload: "Recharger la config et les langues"
    create: "Créer un clan"
    delete: "Dissoudre ton clan"
    invite: "Inviter un joueur"
    accept: "Accepter une invitation"
    deny: "Refuser une invitation"
    leave: "Quitter ton clan"
    kick: "Exclure un membre"
    transfer: "Transférer la propriété"
    info: "Afficher les détails d'un clan"
    list: "Lister tous les clans"
    admin: "Commandes d'administration"
  info:
    - "<gold>Clan <white><clan>"
    - "<gray>Tag : <tag>"
    - "<gray>Propriétaire : <white><owner>"
    - "<gray>Membres (<white><members></white>/<white><max></white>) : <white><names>"
  list:
    header: "<gold>Clans (<count>)"
    entry: "<gray>- <white><clan></white> <tag> <dark_gray>(<members> membres)"

