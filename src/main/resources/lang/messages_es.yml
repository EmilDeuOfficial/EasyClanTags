    leave:
      name: "<red>Salir del clan"
      lore:
        - "<gray>Salir de <white><clan></white>."
    disband:
      name: "<red>Disolver el clan"
      lore:
        - "<gray>Elimina <white><clan></white> y su etiqueta"
        - "<gray>para todos los miembros."
    back:
      name: "<gray>Atras"
    back-small:
      name: "<gray>Atras"
    dialog-confirm:
      name: "<green>Confirmar"
    dialog-cancel:
      name: "<red>Cancelar"
    invite-entry:
      name: "<white><clan>"
      lore:
        - "<gray>Etiqueta: <tag>"
        - "<gray>Dueño: <white><owner>"
        - "<gray>Miembros: <white><members></white>/<white><max>"
        - ""
        - "<green>Clic izquierdo: aceptar"
        - "<red>Clic derecho: rechazar"
    confirm:
      name: "<green>Guardar la etiqueta"
      lore:
        - "<gray>Comprueba la etiqueta y la guarda"
        - "<gray>para tu clan."
    cancel:
      name: "<red>Cancelar"
      lore:
        - "<gray>Descartar todos los cambios."
    prev-page:
      name: "<gray>Pagina anterior"
    next-page:
      name: "<gray>Pagina siguiente"
    invite-player:
      name: "<green>Invitar a un jugador"
      lore:
        - "<gray>Elige a un jugador conectado sin clan."
    member:
      name: "<white><player>"
      lore-owner:
        - "<gold>Dueño"
        - "<status>"
      lore-member:
        - "<gray>Miembro"
        - "<status>"
      lore-manage:
        - "<gray>Miembro"
        - "<status>"
        - ""
        - "<yellow>Clic para gestionar"
      lore-action:
        - "<status>"
      lore-invite:
        - "<yellow>Clic para invitar"
    kick:
      name: "<red>Expulsar a <player>"
      lore:
        - "<gray>Saca al jugador del clan."
